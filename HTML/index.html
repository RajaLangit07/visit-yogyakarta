<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit to Yogyakarta</title>
    <link rel="stylesheet" href="../CSS/style.css" />
    <script src="../JS/main.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/navbar.css" />
  </head>
  <body>
    <nav class="navbar navbar-auto">
      <a class="brand" href="index.html">Visit to Yogyakarta</a>

      <div class="lang">
        <button type="button" class="lang-btn" id="langBtn">
          <span id="langLabel">ID</span>
        </button>
        <ul class="lang-menu" id="langMenu">
          <li>
            <button type="button" data-lang="id">Bahasa Indonesia</button>
          </li>
          <li>
            <button type="button" data-lang="en">English</button>
          </li>
        </ul>
      </div>
    </nav>

    <main>
      <section class="hero" id="hero" aria-label="Jelajahi destinasi Indonesia">
        <div class="selector">
          <div class="pointer" aria-hidden="true"></div>
          <button
            class="arrow prev"
            type="button"
            aria-label="Destinasi sebelumnya">
            &#10094;
          </button>
          <div class="track-wrap">
            <div class="track" id="track"></div>
          </div>
          <button
            class="arrow next"
            type="button"
            aria-label="Destinasi berikutnya">
            &#10095;
          </button>
        </div>
      </section>
    </main>
    <script src="../JS/lang.js"></script>
  </body>
</html>
